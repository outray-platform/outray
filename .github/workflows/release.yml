name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI and workspace dependencies
        run: npm run build -- --filter=outray

      - name: Test CLI Secrets and tunnel compatibility
        run: npm test --workspace=outray

      - name: Build binaries
        run: npm run build:binaries --workspace=outray

      - name: Prepare release assets
        working-directory: apps/cli/bin
        run: |
          # Rename binaries to just "outray" for packaging
          mv outray-macos-arm64 outray && tar -czvf outray-macos-arm64.tar.gz outray && rm outray
          mv outray-macos-x64 outray && tar -czvf outray-macos-x64.tar.gz outray && rm outray
          mv outray-linux-x64 outray && tar -czvf outray-linux-x64.tar.gz outray && rm outray
          zip outray-win-x64.zip outray-win-x64.exe && rm outray-win-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            apps/cli/bin/outray-macos-arm64.tar.gz
            apps/cli/bin/outray-macos-x64.tar.gz
            apps/cli/bin/outray-linux-x64.tar.gz
            apps/cli/bin/outray-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sign-macos:
    needs: build
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'outray-macos-*.tar.gz' --dir assets

      - name: Sign and verify macOS binaries
        run: |
          for arch in arm64 x64; do
            mkdir "assets/$arch"
            tar -xzf "assets/outray-macos-$arch.tar.gz" -C "assets/$arch"
            codesign --force --sign - "assets/$arch/outray"
            codesign --verify --strict "assets/$arch/outray"
            tar -czf "assets/outray-macos-$arch.tar.gz" -C "assets/$arch" outray
          done
          native_arch=x64
          if [ "$(uname -m)" = arm64 ]; then native_arch=arm64; fi
          test "$("assets/$native_arch/outray" --version)" = "outray version ${RELEASE_TAG#v}"

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" assets/outray-macos-*.tar.gz --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-npm:
    needs: sign-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --filter=outray

      - name: Publish to npm
        working-directory: apps/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

  update-homebrew:
    needs: sign-macos
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: outray-platform/homebrew-tap
          event-type: update-formula
          client-payload: '{"version": "${{ github.ref_name }}"}'

  update-scoop:
    needs: sign-macos
    runs-on: ubuntu-latest
    steps:
      - name: Update Scoop bucket
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: outray-platform/scoop-bucket
          event-type: update-manifest
          client-payload: '{"version": "${{ github.ref_name }}"}'
