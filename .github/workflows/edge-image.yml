name: Public edge image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps/tunnel/**, packages/runtime-shared/**, packages/observability/**, shared/**, package-lock.json, Dockerfile, .github/workflows/edge-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/outray-platform/outray-edge:${{ github.sha }}
          build-args: OUTRAY_SOURCE_COMMIT=${{ github.sha }}
